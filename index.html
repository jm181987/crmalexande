<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ZARKO | CRM & Inteligência Comercial</title><meta name="description" content="ZARKO — CRM & Inteligência Comercial. Organize contatos, oportunidades e conversas comerciais em uma plataforma para apoiar a gestão e o relacionamento com clientes."><meta name="author" content="ZARKO"><meta name="robots" content="index,follow"><link rel="canonical" href="https://crmalexandre.vercel.app/"><meta property="og:type" content="website"><meta property="og:locale" content="pt_BR"><meta property="og:site_name" content="ZARKO"><meta property="og:url" content="https://crmalexandre.vercel.app/"><meta property="og:title" content="ZARKO | CRM & Inteligência Comercial"><meta property="og:description" content="ZARKO — CRM & Inteligência Comercial. Organize contatos, oportunidades e conversas comerciais em uma plataforma para apoiar a gestão e o relacionamento com clientes."><meta property="og:image" content="https://crmalexandre.vercel.app/zarko-upload.jpg"><meta property="og:image:alt" content="Logo oficial ZARKO — CRM & Inteligência Comercial"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="ZARKO | CRM & Inteligência Comercial"><meta name="twitter:description" content="ZARKO — CRM & Inteligência Comercial. Organize contatos, oportunidades e conversas comerciais em uma plataforma para apoiar a gestão e o relacionamento com clientes."><meta name="twitter:image" content="https://crmalexandre.vercel.app/zarko-upload.jpg"><link rel="icon" type="image/jpeg" href="/zarko-upload.jpg"><link rel="apple-touch-icon" href="/zarko-upload.jpg"><meta name="theme-color" content="#0A192F"><script>
(function(){
  var fallback='/zarko-upload.jpg';
  function update(logo){
    var url=typeof logo==='string'&&/^data:image\/(png|jpeg|webp);base64,/.test(logo)?logo:fallback;
    ['icon','apple-touch-icon'].forEach(function(rel){
      var el=document.querySelector('link[rel="'+rel+'"]');
      if(!el){el=document.createElement('link');el.rel=rel;document.head.appendChild(el)}
      el.href=url;
      if(rel==='icon')el.type=url.startsWith('data:')?url.slice(5,url.indexOf(';')):'image/jpeg';
    });
  }
  function load(){fetch('/api/public/branding',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('branding');return r.json()}).then(function(b){update(b.logo)}).catch(function(){update(null)})}
  window.addEventListener('crm-brand-updated',function(e){update(e.detail&&e.detail.logo)});
  window.addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&e.data.type==='zarko-brand-logo')update(e.data.logo)});
  load();
})();
</script></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
